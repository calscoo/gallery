<header class="top">
  <a class="brand" href="{{ site.Home.RelPermalink }}">
    <img class="logo" src="{{ "images/logo.png" | relURL }}" alt="Caleb Olson Media" width="992" height="320" />
  </a>
  <nav id="site-nav" aria-label="Rooms">
    {{- range partialCached "rooms.html" . "rooms" }}
    <a href="{{ .RelPermalink }}"{{ if eq .RelPermalink $.RelPermalink }} aria-current="page"{{ end }}>{{ .Title }}</a>
    {{- end }}
    {{- with site.GetPage "/about" }}
    <a href="{{ .RelPermalink }}"{{ if eq .RelPermalink $.RelPermalink }} aria-current="page"{{ end }}>about</a>
    {{- end }}
  </nav>
  <a class="rooms-link" href="{{ site.Home.RelPermalink }}#rooms" aria-controls="site-nav" aria-expanded="false">Rooms</a>
</header>
